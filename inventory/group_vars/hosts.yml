 ============================================================
# Ansible Inventory for Linux Patching
# ============================================================
# Organize servers by OS family for targeted patching.
# Replace with your actual hostnames/IPs and SSH user.
# ============================================================

all:
  children:
    ubuntu:
      hosts:
        ubuntu-server-01:
          ansible_host: 10.0.10.20
          ansible_user: itadmin 
        ubuntu-server-02:
          ansible_host: 10.0.10.23
          ansible_user: itadmin

    redhat:
      hosts:
        rhel-server-01:
          ansible_host: 192.168.1.20
          ansible_user: devops
        rhel-server-02:
          ansible_host: 192.168.1.21
          ansible_user: devops

    # Logical grouping by environment
    dev:
      hosts:
        ubuntu-server-01:
        rhel-server-01:
    prod:
      hosts:
        ubuntu-server-02:
        rhel-server-02:

