---
# ============================================================
# POST-PATCH VALIDATION PLAYBOOK
# Validates system health AFTER patching:
#   - Confirms host is reachable
#   - Validates critical services are running
#   - Checks disk space (no filesystem critically full)
#   - Checks for failed systemd units
#   - Compares kernel pre/post (detect reboot was effective)
#   - Compares package count pre/post
#   - Generates final patch report
# ============================================================

- name: "POST-PATCH | Validate system health after patching"
  hosts: "{{ target_group | default('all') }}"
  become: true
  serial: "{{ serial_batch | default(1) }}"
  gather_facts: true

  tasks:

    # ----------------------------------------------------------
    # 1. CONFIRM HOST REACHABILITY
    # ----------------------------------------------------------
    - name: "POST | Confirm host is reachable"
      ping:
      register: post_ping

    - name: "POST | Display post-patch system info"
      debug:
        msg:
          - "================================================"
          - "  Host:      {{ ansible_hostname }}"
          - "  OS:        {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "  Kernel:    {{ ansible_kernel }}"
          - "  Uptime:    {{ (ansible_uptime_seconds / 3600) | round(2) }} hours"
          - "================================================"

    # ----------------------------------------------------------
    # 2. VALIDATE CRITICAL SERVICES
    # ----------------------------------------------------------
    - name: "POST | Check critical services after patching"
      service_facts:
      register: post_services

    - name: "POST | Validate critical services are running"
      debug:
        msg: "{{ item }}: {{ (post_services.ansible_facts.services[item].state) | default('NOT FOUND') }}"
      loop: "{{ critical_services }}"

    - name: "POST | FAIL if any critical service is down after patching"
      fail:
        msg: >
          CRITICAL: Service '{{ item }}' is not running on {{ ansible_hostname }} after patching!
          Service state: {{ post_services.ansible_facts.services[item].state | default('NOT FOUND') }}
      when: (post_services.ansible_facts.services[item].state | default('absent')) != 'running'
      loop: "{{ critical_services }}"

    # ----------------------------------------------------------
    # 3. CHECK DISK SPACE (post-patch)
    # ----------------------------------------------------------
    - name: "POST | Check disk usage after patching"
      shell: df -h --output=target,size,used,avail,pcent | tail -n +2
      register: post_disk_usage
      changed_when: false

    - name: "POST | Display post-patch disk usage"
      debug:
        var: post_disk_usage.stdout_lines

    - name: "POST | Check root filesystem percentage"
      command: df -h --output=pcent /
      register: post_root_disk
      changed_when: false

    - name: "POST | FAIL if root filesystem exceeds critical threshold"
      fail:
        msg: >
          CRITICAL: Root filesystem is {{ post_root_disk.stdout_lines[1] | trim }} used
          after patching. Investigate immediately.
      when: (post_root_disk.stdout_lines[1] | regex_replace('[^0-9]', '') | int) > 95

    # ----------------------------------------------------------
    # 4. CHECK FAILED SYSTEMD UNITS
    # ----------------------------------------------------------
    - name: "POST | Check for failed systemd units"
      shell: systemctl --failed --no-legend --no-pager 2>/dev/null || true
      register: failed_units
      changed_when: false

    - name: "POST | Display failed systemd units"
      debug:
        var: failed_units.stdout_lines
      when: failed_units.stdout_lines | length > 0

    - name: "POST | Warning if failed units exist"
      debug:
        msg: "WARNING: {{ failed_units.stdout_lines | length }} failed systemd unit(s) on {{ ansible_hostname }}. Review before signing off."
      when: failed_units.stdout_lines | length > 0

    # ----------------------------------------------------------
    # 5. CAPTURE POST-PATCH PACKAGE LIST
    # ----------------------------------------------------------
    - name: "POST | Capture installed packages (Ubuntu/Debian)"
      shell: dpkg-query -W -f='${Package} ${Version}\n' | sort
      register: post_packages_ubuntu
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: "POST | Capture installed packages (RedHat)"
      shell: rpm -qa --queryformat '%{NAME} %{VERSION}-%{RELEASE}\n' | sort
      register: post_packages_redhat
      changed_when: false
      when: ansible_os_family == "RedHat"

    - name: "POST | Save post-patch package count"
      set_fact:
        post_patch_package_count: "{{ (post_packages_ubuntu.stdout_lines | default(post_packages_redhat.stdout_lines)) | length }}"

    # ----------------------------------------------------------
    # 6. CHECK REBOOT STATUS
    # ----------------------------------------------------------
    - name: "POST | Check if reboot still required (Ubuntu)"
      stat:
        path: /var/run/reboot-required
      register: post_reboot_required_ubuntu
      when: ansible_os_family == "Debian"

    - name: "POST | Check if reboot still required (RedHat 8+)"
      command: needs-restarting -r
      register: post_reboot_required_redhat
      failed_when: false
      changed_when: false
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution_major_version | int >= 8

    - name: "POST | Set reboot still required flag"
      set_fact:
        reboot_still_required: >-
          {{ post_reboot_required_ubuntu.stat.exists | default(false) if ansible_os_family == 'Debian'
             else (post_reboot_required_redhat.rc | default(0)) == 1 }}

    - name: "POST | Warn if reboot is still required"
      debug:
        msg: "WARNING: Reboot is still required on {{ ansible_hostname }}. Schedule a reboot."
      when: reboot_still_required | bool

    # ----------------------------------------------------------
    # 7. GENERATE FINAL REPORT
    # ----------------------------------------------------------
    - name: "POST | Generate post-patch report"
      copy:
        content: |
          ================================================================
          POST-PATCH VALIDATION REPORT
          ================================================================
          Host:               {{ ansible_hostname }}
          IP:                 {{ ansible_default_ipv4.address | default('N/A') }}
          OS:                 {{ ansible_distribution }} {{ ansible_distribution_version }}
          Kernel (post):      {{ ansible_kernel }}
          Uptime (hours):     {{ (ansible_uptime_seconds / 3600) | round(2) }}
          
          --------------------------------------------------------------
          PACKAGE SUMMARY
          --------------------------------------------------------------
          Packages installed:  {{ post_patch_package_count }}
          Pending updates:     {{ (ubuntu_pending_count.stdout | default(redhat_pending_count.stdout | default('N/A'))) }}
          
          --------------------------------------------------------------
          DISK USAGE (POST-PATCH)
          --------------------------------------------------------------
          {{ post_disk_usage.stdout }}
          
          --------------------------------------------------------------
          CRITICAL SERVICES STATUS
          --------------------------------------------------------------
          {% for svc in critical_services %}
          {{ svc }}: {{ post_services.ansible_facts.services[svc].state | default('NOT FOUND') }}
          {% endfor %}
          
          --------------------------------------------------------------
          FAILED SYSTEMD UNITS
          --------------------------------------------------------------
          {% if failed_units.stdout_lines | length > 0 %}
          {{ failed_units.stdout }}
          {% else %}
          None - All systemd units are healthy
          {% endif %}
          
          --------------------------------------------------------------
          REBOOT STATUS
          --------------------------------------------------------------
          Reboot still required: {{ reboot_still_required | bool }}
          
          --------------------------------------------------------------
          VALIDATION RESULT
          --------------------------------------------------------------
          {% if reboot_still_required | bool %}
          STATUS: WARNING - Reboot still required
          {% else %}
          STATUS: PASS - All checks passed
          {% endif %}
          ================================================================
        dest: "{{ report_dir }}/post_patch_{{ ansible_hostname }}.txt"
      delegate_to: localhost
      become: false

    - name: "POST | Save post-patch package list"
      copy:
        content: "{{ post_packages_ubuntu.stdout | default(post_packages_redhat.stdout) }}"
        dest: "{{ report_dir }}/post_packages_{{ ansible_hostname }}.txt"
      delegate_to: localhost
      become: false

    # ----------------------------------------------------------
    # 8. PACKAGE DIFF (pre vs post)
    # ----------------------------------------------------------
    - name: "POST | Create package diff (pre vs post)"
      shell: |
        diff "{{ report_dir }}/pre_packages_{{ ansible_hostname }}.txt" \
             "{{ report_dir }}/post_packages_{{ ansible_hostname }}.txt" \
        > "{{ report_dir }}/package_diff_{{ ansible_hostname }}.txt" 2>&1 || true
      delegate_to: localhost
      become: false

    - name: "POST | Display package diff summary"
      shell: "wc -l < {{ report_dir }}/package_diff_{{ ansible_hostname }}.txt"
      register: diff_line_count
      delegate_to: localhost
      become: false
      changed_when: false

    - name: "POST | Show diff summary"
      debug:
        msg: "Package changes detected: {{ diff_line_count.stdout | trim }} lines in diff for {{ ansible_hostname }}"

    - name: "POST | Validation completed"
      debug:
